version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "{host_port}:80"
    volumes:
      - "/var/apps/magic-nginx/shares/nginx/conf.d:/etc/nginx/conf.d"
      - "/var/apps/magic-nginx/shares/nginx/html:/usr/share/nginx/html"
      - "/var/apps/magic-nginx/shares/nginx/logs:/var/log/nginx"
    restart: unless-stopped